<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#1565c0">

  <meta
    name="description"
    content="パチンコボーダー検索">

  <title>パチンコボーダー検索</title>

  <link
    rel="manifest"
    href="./manifest.json">

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png">

  <link
    rel="stylesheet"
    href="./style.css">

</head>

<body>

  <header class="header">

    <h1 class="title">
      パチンコボーダー検索
    </h1>

    <div class="panel">

      <input
        id="search"
        class="input"
        type="text"
        placeholder="機種名検索">

      <input
        id="custom"
        class="input small"
        type="number"
        step="0.5"
        min="25"
        max="40"
        value="27.5"
        placeholder="交換率">

    </div>

    <div
      id="resultCount"
      class="result-count">
      0件
    </div>

    <div
      id="lastUpdate"
      class="last-update">
      更新日時取得中...
    </div>

  </header>

  <main id="machines">

    <div class="loading">

      データ読込中...

    </div>

  </main>

  <script
    type="module"
    src="./app.js"></script>

</body>

</html>
